<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="240" height="180">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C59A53" />
      <stop offset="35%" stop-color="#E5C784" />
      <stop offset="70%" stop-color="#B8873E" />
      <stop offset="100%" stop-color="#966B27" />
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EED59B" />
      <stop offset="100%" stop-color="#B8860B" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#8B6B2B" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Outer Oval Border -->
  <ellipse cx="120" cy="90" rx="106" ry="80" fill="#FCFAF6" stroke="url(#goldGrad)" stroke-width="2" filter="url(#subtleShadow)"/>
  <!-- Inner Oval Border -->
  <ellipse cx="120" cy="90" rx="100" ry="74" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" stroke-dasharray="3, 2" opacity="0.8"/>

  <!-- Top Cake Icon -->
  <g transform="translate(120, 28) scale(0.9)" text-anchor="middle">
    <!-- Plate -->
    <ellipse cx="0" cy="18" rx="18" ry="3" fill="none" stroke="url(#goldGrad)" stroke-width="1.2"/>
    <!-- Bottom Tier -->
    <rect x="-14" y="9" width="28" height="8" rx="1.5" fill="none" stroke="url(#goldGrad)" stroke-width="1.2"/>
    <!-- Top Tier -->
    <rect x="-9" y="3" width="18" height="6" rx="1.5" fill="none" stroke="url(#goldGrad)" stroke-width="1.2"/>
    <!-- Candle / Topper -->
    <line x1="0" y1="3" x2="0" y2="-1" stroke="url(#goldGrad)" stroke-width="1.2"/>
    <ellipse cx="0" cy="-3" rx="1.2" ry="2" fill="url(#goldGrad)"/>
    <!-- Decorative side flourishes -->
    <path d="M-22,17 Q-28,14 -25,9 Q-23,12 -18,15" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.8"/>
    <path d="M22,17 Q28,14 25,9 Q23,12 18,15" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.8"/>
  </g>

  <!-- Typography: Maison -->
  <text x="120" y="82" text-anchor="middle" font-family="'Alex Brush', 'Playfair Display', cursive, serif" font-size="34" font-weight="normal" fill="url(#goldGrad)" letter-spacing="1">Maison</text>
  
  <!-- Typography: Cakery -->
  <text x="120" y="116" text-anchor="middle" font-family="'Alex Brush', 'Playfair Display', cursive, serif" font-size="34" font-weight="normal" fill="url(#goldGrad)" letter-spacing="1">Cakery</text>

  <!-- Small Divider with center diamond -->
  <g stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.7">
    <line x1="85" y1="126" x2="108" y2="126" />
    <polygon points="120,124 122.5,126 120,128 117.5,126" fill="url(#goldGrad)"/>
    <line x1="132" y1="126" x2="155" y2="126" />
  </g>

  <!-- Subtitle: ORDER 0783 206 270 -->
  <text x="120" y="139" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="7.5" font-weight="600" fill="url(#goldGrad)" letter-spacing="2.5" opacity="0.95">ORDER</text>
  <text x="120" y="152" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="9" font-weight="600" fill="url(#goldGrad)" letter-spacing="2" opacity="0.95">0783 206 270</text>
</svg>
